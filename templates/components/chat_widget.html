{% load static %}
<link rel="stylesheet" href="{% static 'core/css/chat_widget.css' %}">

<button type="button" id="aa-chat-tip">Men Aanick sun'iy intellektman. Qanday yordam bera olaman?</button>
<button type="button" id="aa-chat-btn" aria-label="Chatni ochish" aria-expanded="false" aria-controls="aa-chat-box">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>
</button>

<div id="aa-chat-box" role="dialog" aria-label="Aanick AI chat"
     data-api="/api/chat/" data-csrf="{{ csrf_token }}">
  <div class="aa-head"><span>Aanick AI</span><button type="button" id="aa-close" aria-label="Yopish">&times;</button></div>
  <div id="aa-msgs" aria-live="polite"></div>
  <div class="aa-in">
    <input id="aa-input" type="text" maxlength="500" placeholder="Savolingizni yozing..." autocomplete="off" aria-label="Xabar">
    <button type="button" id="aa-send">Yuborish</button>
  </div>
</div>

<script src="{% static 'core/js/chat_widget.js' %}" defer></script>
