{# templates/chat_widget.html — base.html ichida </body> dan oldin: {% include "chat_widget.html" %} #}
<style>
  #aa-chat-btn{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;
    background:#141414;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:9998;display:flex;align-items:center;justify-content:center;
    animation:aa-pulse 2.4s infinite}
  #aa-chat-btn svg{width:28px;height:28px}
  @keyframes aa-pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

  #aa-chat-tip{position:fixed;right:92px;bottom:34px;max-width:240px;background:#fff;color:#141414;padding:10px 14px;border-radius:14px 14px 4px 14px;
    font:14px/1.35 Inter,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9998;cursor:pointer;
    animation:aa-wiggle 3s ease-in-out infinite;transform-origin:right bottom}
  @keyframes aa-wiggle{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-4deg)}70%{transform:rotate(4deg)}75%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}85%{transform:rotate(0)}}

  #aa-chat-box{position:fixed;right:22px;bottom:96px;width:360px;max-width:calc(100vw - 24px);height:480px;max-height:calc(100vh - 120px);
    background:#1b1b1b;color:#f2f2f2;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:9999;display:none;flex-direction:column;
    overflow:hidden;font:14px/1.4 Inter,system-ui,sans-serif}
  #aa-chat-box.open{display:flex}
  .aa-head{padding:14px 16px;background:#141414;border-bottom:1px solid #2c2c2c;display:flex;justify-content:space-between;align-items:center;font-weight:500}
  .aa-head button{background:none;border:0;color:#aaa;font-size:20px;cursor:pointer}
  #aa-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .aa-m{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
  .aa-m.bot{background:#2a2a2a;align-self:flex-start;border-bottom-left-radius:4px}
  .aa-m.me{background:#fff;color:#141414;align-self:flex-end;border-bottom-right-radius:4px}
  .aa-in{display:flex;gap:8px;padding:10px;border-top:1px solid #2c2c2c;background:#141414}
  .aa-in input{flex:1;background:#2a2a2a;border:0;border-radius:10px;padding:10px 12px;color:#fff;font:inherit;outline:none}
  .aa-in button{background:#fff;color:#141414;border:0;border-radius:10px;padding:0 14px;font-weight:600;cursor:pointer}
  .aa-in button:disabled{opacity:.5;cursor:default}
</style>

<div id="aa-chat-tip">Men Aanick sun'iy intellektman. Qanday yordam bera olaman?</div>
<button id="aa-chat-btn" aria-label="Chatni ochish">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>
</button>

<div id="aa-chat-box">
  <div class="aa-head"><span>Aanick AI</span><button id="aa-close" aria-label="Yopish">&times;</button></div>
  <div id="aa-msgs"></div>
  <div class="aa-in">
    <input id="aa-input" type="text" maxlength="500" placeholder="Savolingizni yozing..." autocomplete="off">
    <button id="aa-send">Yuborish</button>
  </div>
</div>

<script>
(function(){
  var btn=document.getElementById('aa-chat-btn'), tip=document.getElementById('aa-chat-tip'),
      box=document.getElementById('aa-chat-box'), msgs=document.getElementById('aa-msgs'),
      input=document.getElementById('aa-input'), send=document.getElementById('aa-send');
  var history=[], busy=false, CSRF="{{ csrf_token }}";

  function add(text, who){
    var d=document.createElement('div'); d.className='aa-m '+who; d.textContent=text;
    msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
  }
  function open(){ box.classList.add('open'); tip.style.display='none'; input.focus();
    if(!msgs.children.length) add("Salom! Men Aanick sun'iy intellektman. Qanday yordam bera olaman?", 'bot'); }
  function toggle(){ box.classList.contains('open') ? box.classList.remove('open') : open(); }

  btn.addEventListener('click', toggle);
  tip.addEventListener('click', open);
  document.getElementById('aa-close').addEventListener('click', function(){ box.classList.remove('open'); });

  async function submit(){
    var text=input.value.trim(); if(!text||busy) return;
    input.value=''; add(text,'me'); history.push({role:'user',content:text});
    busy=true; send.disabled=true;
    var wait=add('...','bot');
    try{
      var r=await fetch('/api/chat/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},
        body:JSON.stringify({messages:history})});
      var j=await r.json(); wait.textContent=j.reply; history.push({role:'assistant',content:j.reply});
    }catch(e){ wait.textContent="Aloqa xatosi. Qayta urinib ko'ring."; }
    busy=false; send.disabled=false; msgs.scrollTop=msgs.scrollHeight; input.focus();
  }
  send.addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>
